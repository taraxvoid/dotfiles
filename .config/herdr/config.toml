onboarding = false

[terminal]
new_cwd = "follow"

[theme]
name = "terminal"

# herdr has no dedicated pane border color (herdrdev/herdr#1985, closed as not
# planned), so recolor the theme accent, which drives the borders.
[theme.custom]
accent = "#b794f6"

[keys]
prefix = "ctrl+a"
cycle_pane_previous = "ctrl+h"
cycle_pane_next = "ctrl+;"
previous_agent = "ctrl+comma"
next_agent = "ctrl+period"
last_pane = "ctrl+space"
focus_agent = "prefix+alt+1..9"

previous_tab = ["prefix+p", "ctrl+["]
next_tab = ["prefix+n", "ctrl+]"]
previous_workspace = "ctrl+alt+["
next_workspace = "ctrl+alt+]"

new_tab = "prefix+c"

# clear the pane (ctrl+l as "cls") without relying on the shell's clear-screen
clear_pane = "ctrl+l"

# popup commands run via /bin/sh -c, and gps is a zsh function, so go through
# an interactive zsh. _herdr_popup (.zsh_aliases) keeps output on screen until a
# key is pressed and cd's the calling pane after a checkout.
[[keys.command]]
key = "ctrl+s"
type = "popup"
command = "zsh -ic '_herdr_popup gps'"
width = "90%"
height = "90%"

[[keys.command]]
key = "ctrl+e"
type = "popup"
command = "zsh -ic '_herdr_popup gwo'"
width = "90%"
height = "90%"

[[keys.command]]
key = "ctrl+o"
type = "popup"
command = "zsh -ic '_herdr_popup gpo'"
width = "90%"
height = "90%"

# yazi in the focused pane's dir; files open in nvim inside the popup
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && zsh -ic yazi"
width = "90%"
height = "90%"
description = "file manager"

# shell under the focused pane; the agent keeps the top 70%
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane split \"$HERDR_ACTIVE_PANE_ID\" --direction down --ratio 0.7 --focus"
description = "terminal below"

# agent tab: new tab with the agent on top and a shell below (prefix+c stays a lone shell)
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "p=$(\"$HERDR_BIN_PATH\" tab create --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" --cwd \"$HERDR_ACTIVE_PANE_CWD\" --focus | jq -r .result.root_pane.pane_id) && \"$HERDR_BIN_PATH\" pane split \"$p\" --direction down --ratio 0.7 --cwd \"$HERDR_ACTIVE_PANE_CWD\" --no-focus"
description = "agent tab (shell below)"

# cycle only agents waiting for input (status "blocked"), after/before the
# focused one, wrapping; no-ops when none are blocked. Mirrors next_agent and
# previous_agent (ctrl+period / ctrl+comma) with cmd added.
[[keys.command]]
key = "cmd+ctrl+period"
type = "shell"
command = "\"$HERDR_BIN_PATH\" agent list | jq -r '.result.agents as $a | (($a | map(.focused == true) | index(true)) // -1) as $f | [range(0; $a | length) | select($a[.].agent_status == \"blocked\")] as $b | (([$b[] | select(. > $f)] + $b)[0]) as $i | if $i == null then empty else $a[$i].pane_id end' | { read -r id; [ -z \"$id\" ] || \"$HERDR_BIN_PATH\" agent focus \"$id\"; }"
description = "next agent waiting for input"

[[keys.command]]
key = "cmd+ctrl+comma"
type = "shell"
command = "\"$HERDR_BIN_PATH\" agent list | jq -r '.result.agents as $a | (($a | map(.focused == true) | index(true)) // -1) as $f | [range(0; $a | length) | select($a[.].agent_status == \"blocked\")] as $b | ((([$b[] | select(. < $f)] | reverse) + ($b | reverse))[0]) as $i | if $i == null then empty else $a[$i].pane_id end' | { read -r id; [ -z \"$id\" ] || \"$HERDR_BIN_PATH\" agent focus \"$id\"; }"
description = "previous agent waiting for input"

# agent picker: waiting first, then most recently active (ai in .zsh_aliases)
[[keys.command]]
key = "ctrl+g"
type = "popup"
command = "zsh -ic ai"
width = "90%"
height = "90%"
description = "agent picker"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[ui]
status_indicators = "dots"
