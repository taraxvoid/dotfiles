onboarding = false

[terminal]
new_cwd = "follow"

[theme]
name = "terminal"

[keys]
prefix = "ctrl+a"
cycle_pane_previous = "ctrl+h"
cycle_pane_next = "ctrl+;"
previous_agent = "ctrl+comma"
next_agent = "ctrl+period"
last_pane = "ctrl+space"
focus_agent = "prefix+alt+1..9"

previous_tab = ["prefix+p", "ctrl+["]
next_tab = ["prefix+n", "ctrl+]"]
previous_workspace = "ctrl+alt+["
next_workspace = "ctrl+alt+]"

new_tab = "prefix+c"

# popup commands run via /bin/sh -c, and gps is a zsh function, so go through
# an interactive zsh. _herdr_popup (.zsh_aliases) keeps output on screen until a
# key is pressed and cd's the calling pane after a checkout.
[[keys.command]]
key = "ctrl+p"
type = "popup"
command = "zsh -ic '_herdr_popup gps'"
width = "90%"
height = "90%"

[[keys.command]]
key = "ctrl+o"
type = "popup"
command = "zsh -ic '_herdr_popup gpo'"
width = "90%"
height = "90%"

# yazi in the focused pane's dir; files open in nvim inside the popup
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && zsh -ic yazi"
width = "90%"
height = "90%"
description = "file manager"

# shell under the focused pane; the agent keeps the top 70%
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane split \"$HERDR_ACTIVE_PANE_ID\" --direction down --ratio 0.7 --focus"
description = "terminal below"

# agent tab: new tab with the agent on top and a shell below (prefix+c stays a lone shell)
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "p=$(\"$HERDR_BIN_PATH\" tab create --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" --cwd \"$HERDR_ACTIVE_PANE_CWD\" --focus | jq -r .result.root_pane.pane_id) && \"$HERDR_BIN_PATH\" pane split \"$p\" --direction down --ratio 0.7 --cwd \"$HERDR_ACTIVE_PANE_CWD\" --no-focus"
description = "agent tab (shell below)"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[ui]
status_indicators = "dots"
