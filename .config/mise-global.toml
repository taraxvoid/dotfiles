[tools]
# every tool is pinned to an exact version; bump on purpose (or via Renovate)
node = "26.10.0"
pnpm = "12.8.1"
usage = "6.12.1" # mise's completions call it at tab time
# CLI tools. Debian's apt versions are years old, so mise (aqua backend: checksum and
# attestation verified GitHub releases) provides them. uv and bun are deliberately
# absent: they come from their vendor installers (install.sh), and a mise copy would
# shadow them silently in projects that don't pin a version.
"aqua:neovim/neovim" = "0.12.6"
fzf = "0.74.4"
ripgrep = "15.2.0"
zoxide = "0.10.0"
just = "1.58.0"
yq = "4.54.1"
jq = "1.8.1"
fd = "10.4.2"
bat = "0.26.1" # aliased to cat in .zsh_aliases
starship = "1.26.0"
"aqua:dandavison/delta" = "0.20.1" # git pager (.gitconfig falls back to less without it)
shellcheck = "0.11.0"

[settings]
# Supply-chain cooldown, same 3 days as ~/.bunfig.toml, npm, pnpm and uv
# (install.sh): a version request like node@26 or latest only resolves to
# releases at least this old. Exact pins are not filtered; the npm: and pypi:
# backends pass it on to the package manager for unpinned dependencies.
# mise's own self-updates use it too.
minimum_release_age = "3d"
self_update.auto = true
# Without this, mise still reads a config that only has [tools] from an untrusted
# dir, and `bun run dev` there would download and install whatever it pins, outside
# the sandbox. Paranoid refuses every untrusted config.
paranoid = true
# A mise.toml can set env vars, run hooks and define tasks, so mise refuses to read
# an untrusted one (and therefore never auto-installs its tools). Only the
# first-party trees are trusted by path. ~/projects/untrusted is deliberately
# absent: use `sbx` there. Keep in step with the post-checkout hook in
# .config/git/template/hooks. Repo configs cannot change this setting.
trusted_config_paths = [
  "~/projects/personal",
  "~/projects/ravenflight",
  "~/worktrees/personal",
  "~/worktrees/ravenflight",
]
