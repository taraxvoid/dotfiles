# The current version of the config schema
version: 1
# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor: vim
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# A pager program to send command output to, e.g. "less". If blank, will refer to environment. Set the value to "cat" to disable the pager.
pager:
# Aliases allow you to create nicknames for gh commands
aliases:
    co: pr checkout
    draft-pr: pr create --draft
    # Fixed-shape writes Claude may run unprompted (see README, "Claude gh api guard").
    # reply-thread <pr> <comment-id> <body>: reply to an inline review comment in the current repo.
    # Both ids must be digits only: anything else (e.g. '#' or '/') would reroute the URL.
    reply-thread: |-
        !for n in "$1" "$2"; do case "$n" in ''|*[!0-9]*) echo "usage: gh reply-thread <pr-number> <comment-id> <body>" >&2; exit 2;; esac; done; gh api "repos/{owner}/{repo}/pulls/$1/comments/$2/replies" -f body="$3" --jq .html_url
    # resolve-thread <thread-node-id>: resolve one review thread (id looks like PRRT_...).
    resolve-thread: |-
        !gh api graphql -f id="$1" -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' --jq .data.resolveReviewThread.thread.isResolved
    # pending-deploys: runs waiting on a deployment review, one line per environment (run id, environment, can-approve|no-access).
    pending-deploys: |-
        !ids=$(gh run list --status waiting --json databaseId -q '.[].databaseId') || exit 1; for id in $ids; do rows=$(gh api "repos/{owner}/{repo}/actions/runs/$id/pending_deployments" --jq '.[] | "\(.environment.name)\t\(if .current_user_can_approve then "can-approve" else "no-access" end)"') || exit 1; if [ -n "$rows" ]; then printf '%s\n' "$rows" | awk -v id="$id" '{print id "\t" $0}'; fi; done
    # review-deploy <approved|rejected> <run-id> [comment]: review every pending environment you can approve on one run.
    # Deliberately not in permissions.allow: Claude must ask before approving or rejecting a deployment.
    review-deploy: |-
        !usage() { echo "usage: gh review-deploy <approved|rejected> <run-id> [comment]" >&2; exit 2; }; case "$1" in approved|rejected) ;; *) usage;; esac; case "$2" in ''|*[!0-9]*) usage;; esac; ids=$(gh api "repos/{owner}/{repo}/actions/runs/$2/pending_deployments" --jq '[.[] | select(.current_user_can_approve) | .environment.id]') || exit 1; [ -n "$ids" ] && [ "$ids" != "[]" ] || { echo "no pending deployments you can review on run $2" >&2; exit 1; }; jq -n --argjson ids "$ids" --arg s "$1" --arg c "${3:-$1 via gh}" '{environment_ids:$ids,state:$s,comment:$c}' | gh api --method POST "repos/{owner}/{repo}/actions/runs/$2/pending_deployments" --input - --jq '.[].environment'
# The path to a unix socket through which to send HTTP connections. If blank, HTTP traffic will be handled by net/http.DefaultTransport.
http_unix_socket:
# What web browser gh should use when opening URLs. If blank, will refer to environment.
browser:
# Whether to display labels using their RGB hex color codes in terminals that support truecolor. Supported values: enabled, disabled
color_labels: disabled
# Whether customizable, 4-bit accessible colors should be used. Supported values: enabled, disabled
accessible_colors: disabled
# Whether an accessible prompter should be used. Supported values: enabled, disabled
accessible_prompter: disabled
# Whether to use an animated spinner as a progress indicator. If disabled, a textual progress indicator is used instead. Supported values: enabled, disabled
spinner: enabled
expiring_credentials: enabled
