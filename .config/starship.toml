# Needs a Nerd Font in the terminal (install.sh installs JetBrainsMono Nerd Font)
# Outrun palette, tuned for contrast on dark backgrounds (needs truecolor)
add_newline = false
command_timeout = 500
scan_timeout = 500
palette = "outrun"

format = """$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$line_break$character"""

[palettes.outrun]
cyan = "#36e2ff"
pink = "#ff8ae2"
orange = "#ff9e4a"
lilac = "#b9a0ff"
muted = "#9a93c4"
red = "#ff5370"

[directory]
style = "bold cyan"
truncation_length = 5
truncation_symbol = "…/"
read_only = " \U000F033E"
read_only_style = "red"

[git_branch]
symbol = "\uE0A0 "
style = "bold pink"

[git_status]
style = "bold orange"

[nodejs]
symbol = "\uE718 "
style = "lilac"

[python]
symbol = "\uE73C "
style = "lilac"

[rust]
symbol = "\U000F1617 "
style = "lilac"

[golang]
symbol = "\uE627 "
style = "lilac"

[cmd_duration]
style = "muted"

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"
