# Plain-text symbols: the terminal (ChromeOS Terminal) has no Nerd Font
# Outrun palette, tuned for contrast on dark backgrounds (needs truecolor)
add_newline = false
scan_timeout = 500
palette = "outrun"

format = """$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$line_break$character"""

[palettes.outrun]
cyan = "#36e2ff"
pink = "#ff8ae2"
orange = "#ff9e4a"
lilac = "#b9a0ff"
muted = "#9a93c4"
red = "#ff5370"

[directory]
style = "bold cyan"
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " (ro)"
read_only_style = "red"

[directory.substitutions]
"~/worktrees" = "wt"
"~/projects" = "proj"

[git_branch]
symbol = ""
style = "bold pink"

[git_status]
style = "bold orange"

[nodejs]
symbol = "node "
style = "lilac"

[python]
symbol = "py "
style = "lilac"

[rust]
symbol = "rs "
style = "lilac"

[golang]
symbol = "go "
style = "lilac"

[cmd_duration]
style = "muted"
disabled = true

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"
