pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "{install.sh,.claude/scripts/*.sh,.local/bin/*,.config/git/template/hooks/*}"
      run: shellcheck {staged_files}
    zsh-syntax:
      glob: "{.zshrc,.zshenv,.zsh_aliases}"
      run: zsh -n {staged_files}
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner -l warn
