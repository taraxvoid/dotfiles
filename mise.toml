# Repo dev tools. CI installs these same versions through jdx/mise-action. They
# come from the aqua backend, which checks each release's checksum and GitHub
# attestation; Renovate bumps them after a 3-day minimum age.
[tools]
actionlint = "1.7.12"
bats = "1.13.0"
fd = "10.4.2" # fdsd test
gitleaks = "8.30.1"
lefthook = "2.1.17"
sd = "1.1.0" # fdsd test
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.lint]
description = "Run the same checks as CI over every file (not just staged)"
run = "lefthook run pre-commit --all-files"

[tasks.test]
description = "Run the bats tests"
run = "bats tests/"
