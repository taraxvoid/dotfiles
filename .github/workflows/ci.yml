name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false

      # The tools pinned in mise.toml (aqua backend: checksum and attestation
      # verified), the same versions lefthook runs locally.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.5
          cache: false # no cache to poison; installs take seconds

      - name: Secrets scan
        # gitleaks is feature-complete (no further development); betterleaks is
        # the successor, revisit at 1.x. Known findings go in .gitleaksignore.
        run: gitleaks git --redact --no-banner --verbose .

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh .claude/scripts/*.sh .local/bin/* .config/git/template/hooks/* tests/fake-gh/gh

      - name: Workflow lint (actionlint, zizmor)
        run: |
          actionlint
          zizmor --format=github .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (known-vulnerable actions)

      - name: ssh config
        run: scripts/check-ssh.sh

      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh
          zsh -n .zshrc .zshenv .zsh_aliases

      - name: bats
        run: bats tests/

  # install.sh end to end on a fresh machine, twice (the second run must be a
  # no-op), then an interactive zsh. Debian in a clean container, plus macOS.
  install-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:stable
    steps:
      - name: Base packages a fresh Debian install has
        run: apt-get update -qq && apt-get install -y -qq sudo git ca-certificates >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install.sh smoke test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # fresh container: mise refuses the checkout's mise.toml until trusted
          export MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE"
          # keep that through install.sh replacing ~/.gitconfig with a link
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*'
          scripts/smoke-install.sh
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }} # avoid GitHub API rate limits

  install-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install.sh smoke test
        run: scripts/smoke-install.sh
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: 1
